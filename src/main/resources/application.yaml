spring:
  application:
    name: sidating-app-be-2

  mvc:
    hiddenmethod:
      filter:
        enabled: true

  profiles:
    active: 'dev'

  main:
    allow-circular-references: true

  jpa:
    hibernate:
      ddl-auto: create-drop

sidating-app-be:
  app:
    jwtSecret: "${JWT_SECRET_KEY}"
    jwtExpirationMs: 86400000
