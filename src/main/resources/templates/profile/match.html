<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Love Match Score</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
        }
    </style>
</head>
<body class="bg-gray-50">
    <!-- Navigation Bar -->
    <div th:insert="~{fragments/navbar :: navbar}"></div>
    
    <div class="max-w-2xl mx-auto px-4 py-8">
        <!-- Back Button -->
        <div class="mb-6">
            <a href="/profile" class="inline-flex items-center text-gray-600 hover:text-gray-900 transition-colors">
                <svg class="w-4 h-4 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"></path>
                </svg>
                Back to Profiles
            </a>
        </div>
        
        <div class="bg-white rounded-lg border border-gray-200 p-8">
            <h1 class="text-2xl font-light text-gray-900 text-center mb-8">Love Match Score</h1>
            
            <form th:action="@{/profile/match}" method="get" class="space-y-6">
                <div>
                    <label for="userId1" class="block text-sm font-medium text-gray-700 mb-2">User 1</label>
                    <select name="userId1" id="userId1" required 
                            class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-gray-500 focus:border-transparent">
                        <option value="">Select User 1</option>
                        <option th:each="user : ${allUsers}"
                                th:value="${user.id}"
                                th:text="${user.name}"
                                th:selected="${selectedUser1 != null and user.id.equals(selectedUser1)}">
                        </option>
                    </select>
                </div>
                <div>
                    <label for="userId2" class="block text-sm font-medium text-gray-700 mb-2">User 2</label>
                    <select name="userId2" id="userId2" required 
                            class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-gray-500 focus:border-transparent">
                        <option value="">Select User 2</option>
                        <option th:each="user : ${allUsers}"
                                th:value="${user.id}"
                                th:text="${user.name}"
                                th:selected="${selectedUser2 != null and user.id.equals(selectedUser2)}">
                        </option>
                    </select>
                </div>
                <button type="submit" class="w-full py-3 bg-gray-900 text-white font-medium rounded-lg hover:bg-gray-800 transition-colors">
                    Calculate Match
                </button>
            </form>
            
            <!-- Match Result -->
            <div th:if="${matchResult != null}" class="mt-8 pt-8 border-t border-gray-200">
                <div class="text-center">
                    <div class="mb-4">
                        <span class="text-3xl font-light text-gray-900">Match Score: </span>
                        <span class="text-3xl font-bold text-gray-900" th:text="${matchResult.score} + '%'"></span>
                    </div>
                    <h2 class="text-xl font-medium text-gray-800 mb-6" th:text="${matchResult.message}"></h2>
                    <div class="flex justify-center">
                        <img th:src="${matchResult.imageUrl}" alt="Match Result" class="max-w-xs rounded-lg shadow-lg">
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
