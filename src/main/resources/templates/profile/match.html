<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Love Match Score</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .result-card {
            max-width: 400px;
            margin-top: 2rem;
        }
        .result-card img {
            max-width: 100%;
            height: auto;
            border-radius: 8px;
        }
    </style>
</head>
<body>
<div class="container mt-4">
    <div class="card">
        <div class="card-header">
            <h3>Random Match Score</h3>
        </div>
        <div class="card-body">
            <form th:action="@{/profile/match}" method="get">
                <div class="mb-3">
                    <label for="userId1" class="form-label">User 1</label>
                    <select name="userId1" id="userId1" class="form-select" required>
                        <option value="">-- Pilih User 1 --</option>
                        <option th:each="user : ${allUsers}"
                                th:value="${user.id}"
                                th:text="${user.name}"
                                th:selected="${selectedUser1 != null and user.id.equals(selectedUser1)}">
                        </option>
                    </select>
                </div>
                <div class="mb-3">
                    <label for="userId2" class="form-label">User 2</label>
                    <select name="userId2" id="userId2" class="form-select" required>
                        <option value="">-- Pilih User 2 --</option>
                        <option th:each="user : ${allUsers}"
                                th:value="${user.id}"
                                th:text="${user.name}"
                                th:selected="${selectedUser2 != null and user.id.equals(selectedUser2)}">
                        </option>
                    </select>
                </div>
                <button type="submit" class="btn btn-primary w-100">Match</button>
            </form>
        </div>
    </div>

    <div th:if="${matchResult != null}" class="d-flex justify-content-center">
        <div class="card text-center result-card">
            <div class="card-body">
                <h5>Match Score: <span th:text="${matchResult.score} + '%'"></span></h5>
                <h2 class="card-title my-3" th:text="${matchResult.message}"></h2>
                <img th:src="${matchResult.imageUrl}" alt="Hasil Match">
            </div>
        </div>
    </div>
</div>
</body>
</html>
