<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="UTF-8" />
    <title th:text="${isEdit} ? 'Update Profile' : 'Create Profile'">Form Profile</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
      body {
        font-family: 'Inter', sans-serif;
        margin-top: 10px;
        text-decoration: none;
        background: #007bff;
        color: #fff;
        padding: 6px 12px;
        border-radius: 4px;
      }
      a:hover {
        background: #0056b3;
      }
    </style>
  </head>
  <body class="bg-gray-50">
    <!-- Navigation Bar -->
    <div th:insert="~{fragments/navbar :: navbar}"></div>
    
    <div class="max-w-2xl mx-auto px-4 py-8">
      <div class="bg-white rounded-lg border border-gray-200 p-8">
        <h1 class="text-2xl font-light text-gray-900 text-center mb-8" th:text="${isEdit} ? 'Update Profile' : 'Create Profile'">Form Profile</h1>
        
        <form th:action="${isEdit ? '/profile/update/'+ profileId : '/profile/create'}" 
              th:method="${isEdit ? 'put' : 'post'}" 
              th:object="${userProfile}" 
              class="space-y-6">
          <input type="hidden" name="_method" value="put" th:if="${isEdit}" />

          <div>
            <label for="name" class="block text-sm font-medium text-gray-700 mb-2">Name</label>
            <input type="text" th:field="*{name}" id="name" required 
                   class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-gray-500 focus:border-transparent" />
          </div>

          <div>
            <label for="nickname" class="block text-sm font-medium text-gray-700 mb-2">Nickname</label>
            <input type="text" th:field="*{nickname}" id="nickname" required 
                   class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-gray-500 focus:border-transparent" />
          </div>

          <div>
            <label for="email" class="block text-sm font-medium text-gray-700 mb-2">Email</label>
            <input type="email" th:field="*{email}" id="email" required 
                   class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-gray-500 focus:border-transparent" />
          </div>

          <div>
            <label for="phoneNumber" class="block text-sm font-medium text-gray-700 mb-2">Phone Number</label>
            <input type="text" th:field="*{phoneNumber}" id="phoneNumber" required 
                   class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-gray-500 focus:border-transparent" />
          </div>

          <div>
            <label for="location" class="block text-sm font-medium text-gray-700 mb-2">Location</label>
            <input type="text" th:field="*{location}" id="location" 
                   class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-gray-500 focus:border-transparent" />
          </div>

          <div>
            <label for="gender" class="block text-sm font-medium text-gray-700 mb-2">Gender</label>
            <select th:field="*{gender}" id="gender" 
                    class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-gray-500 focus:border-transparent">
              <option value="MALE">Male</option>
              <option value="FEMALE">Female</option>
            </select>
          </div>

          <div>
            <label for="birthdate" class="block text-sm font-medium text-gray-700 mb-2">Birthdate</label>
            <input type="date" th:field="*{birthdate}" id="birthdate" 
                   class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-gray-500 focus:border-transparent" />
          </div>

          <div>
            <label for="hobbies" class="block text-sm font-medium text-gray-700 mb-2">Hobbies</label>
            <input type="text" th:field="*{hobbies}" id="hobbies" 
                   class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-gray-500 focus:border-transparent" />
          </div>

          <div>
            <label for="interests" class="block text-sm font-medium text-gray-700 mb-2">Interests</label>
            <input type="text" th:field="*{interests}" id="interests" 
                   class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-gray-500 focus:border-transparent" />
          </div>

          <div>
            <label for="bio" class="block text-sm font-medium text-gray-700 mb-2">Bio</label>
            <textarea th:field="*{bio}" id="bio" rows="4" 
                      class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-gray-500 focus:border-transparent resize-none"></textarea>
          </div>

          <div class="flex justify-center gap-3 pt-4">
            <button type="submit" class="px-6 py-2 bg-gray-900 text-white font-medium rounded-lg hover:bg-gray-800 transition-colors">
              Save
            </button>
            <a th:href="@{/profile}" class="px-6 py-2 border border-gray-300 text-gray-700 font-medium rounded-lg hover:bg-gray-50 transition-colors">
              Cancel
            </a>
          </div>
        </form>
      </div>
    </div>
  </body>
</html>
