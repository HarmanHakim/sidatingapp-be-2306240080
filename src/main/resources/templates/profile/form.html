<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="UTF-8" />
    <title th:text="${isEdit} ? 'Update Profile' : 'Create Profile'">Form Profile</title>
    <style>
      body {
        font-family: Arial, sans-serif;
        background: #f9f9f9;
        margin: 20px;
      }
      .container {
        background: #fff;
        padding: 20px;
        border-radius: 8px;
        box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
        max-width: 500px;
        margin: auto;
      }
      h1 {
        text-align: center;
      }
      label {
        display: block;
        margin-top: 10px;
        font-weight: bold;
      }
      input,
      textarea,
      select {
        width: 100%;
        padding: 8px;
        margin-top: 5px;
        border: 1px solid #ccc;
        border-radius: 4px;
      }
      button {
        margin-top: 15px;
        padding: 8px 16px;
        border: none;
        border-radius: 4px;
        background: #28a745;
        color: #fff;
        cursor: pointer;
      }
      button:hover {
        background: #218838;
      }
      a {
        display: inline-block;
        margin-top: 10px;
        text-decoration: none;
        background: #007bff;
        color: #fff;
        padding: 6px 12px;
        border-radius: 4px;
      }
      a:hover {
        background: #0056b3;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <form th:action="${isEdit ? '/profile/update/'+ profileId : '/profile/create'}" th:method="${isEdit ? 'put' : 'post'}" th:object="${userProfile}">
        <h1 th:text="${isEdit} ? 'Update Profile' : 'Create Profile'">Form Profile</h1>
        <input type="hidden" name="_method" value="put" th:if="${isEdit}" />

        <label>Name</label>
        <input type="text" th:field="*{name}" required />

        <label>Nickname</label>
        <input type="text" th:field="*{nickname}" required />

        <label>Email</label>
        <input type="email" th:field="*{email}" required />

        <label>Phone Number</label>
        <input type="text" th:field="*{phoneNumber}" required />

        <label>Location</label>
        <input type="text" th:field="*{location}" />

        <label>Gender</label>
        <select th:field="*{gender}">
          <option value="MALE">Male</option>
          <option value="FEMALE">Female</option>
        </select>

        <label>Birthdate</label>
        <input type="date" th:field="*{birthdate}" />

        <label>Hobbies</label>
        <input type="text" th:field="*{hobbies}" />

        <label>Interests</label>
        <input type="text" th:field="*{interests}" />

        <label>Bio</label>
        <textarea th:field="*{bio}" rows="3"></textarea>

        <button type="submit">Save</button>
      </form>

      <a th:href="@{/profile}">Cancel</a>
    </div>
  </body>
</html>
