<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="UTF-8" />
    <title>Daftar Profile</title>
    <style>
      body {
        font-family: Arial, sans-serif;
        background: #f9f9f9;
        margin: 20px;
      }
      .container {
        background: #fff;
        padding: 20px;
        border-radius: 8px;
        box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
      }
      h1 {
        text-align: center;
      }
      table {
        width: 100%;
        border-collapse: collapse;
        margin-top: 20px;
      }
      th,
      td {
        border: 1px solid #ddd;
        padding: 8px;
        text-align: left;
      }
      th {
        background: #f0f0f0;
      }
      a,
      button {
        text-decoration: none;
        padding: 6px 12px;
        border-radius: 4px;
        font-size: 14px;
        margin: 2px;
        display: inline-block;
      }
      .btn-primary {
        background: #007bff;
        color: #fff;
      }
      .btn-primary:hover {
        background: #0056b3;
      }
      .btn-warning {
        background: #ffc107;
        color: #000;
      }
      .btn-warning:hover {
        background: #e0a800;
      }
      .btn-danger {
        background: #dc3545;
        color: #fff;
        border: none;
      }
      .btn-danger:hover {
        background: #b02a37;
      }
      .alert {
        padding: 10px;
        border-radius: 4px;
        margin-bottom: 15px;
      }
      .alert-success {
        background: #d4edda;
        color: #155724;
      }
      .alert-error {
        background: #f8d7da;
        color: #721c24;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <h1>Daftar Profile</h1>

      <div th:if="${successMessage}" class="alert alert-success" th:text="${successMessage}"></div>
      <div th:if="${errorMessage}" class="alert alert-error" th:text="${errorMessage}"></div>

      <a class="btn-primary" th:href="@{/profile/create}">Tambah Profile</a>
      <a class="btn-primary" th:href="@{/profile/match}">Love Match</a>


      <table>
        <thead>
          <tr>
            <th>Nama</th>
            <th>Nickname</th>
            <th>Email</th>
            <th>Lokasi</th>
            <th>Aksi</th>
          </tr>
        </thead>
        <tbody>
          <tr th:each="profile : ${userProfiles}">
            <td th:text="${profile.name}"></td>
            <td th:text="${profile.nickname}"></td>
            <td th:text="${profile.email}"></td>
            <td th:text="${profile.location}"></td>
            <td>
              <a class="btn-primary" th:href="@{'/profile/' + ${profile.id}}">Detail</a>
              <a class="btn-warning" th:href="@{'/profile/update/' + ${profile.id}}">Edit</a>
              <form th:action="@{'/profile/delete/' + ${profile.id}}" method="post" style="display: inline">
                <input type="hidden" name="_method" value="delete" />
                <button type="submit" class="btn-danger">Hapus</button>
              </form>
            </td>
          </tr>
        </tbody>
      </table>
    </div>
  </body>
</html>
