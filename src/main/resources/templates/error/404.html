<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${title} ?: 'Page Not Found'">Page Not Found</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
        }
    </style>
</head>
<body class="bg-gray-50">
    <!-- Navigation Bar -->
    <div th:insert="~{fragments/navbar :: navbar}"></div>
    
    <div class="flex items-center justify-center min-h-[calc(100vh-80px)] px-4">
        <div class="text-center max-w-md w-full">
            <div class="text-8xl font-light text-gray-400 mb-6">404</div>
            <h1 class="text-2xl font-light text-gray-900 mb-4" th:text="${title} ?: 'Page Not Found'">Page Not Found</h1>
            <p class="text-gray-600 mb-8" th:text="${message} ?: 'The page you are looking for could not be found.'">
                The page you are looking for could not be found.
            </p>
            <div class="flex gap-3 justify-center">
                <a href="/profile" class="px-4 py-2 bg-gray-900 text-white font-medium rounded-lg hover:bg-gray-800 transition-colors">
                    Back to Profiles
                </a>
                <a href="/" class="px-4 py-2 border border-gray-300 text-gray-700 font-medium rounded-lg hover:bg-gray-50 transition-colors">
                    Home
                </a>
            </div>
        </div>
    </div>
    
</body>
</html>
