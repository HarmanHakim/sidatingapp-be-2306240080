<!DOCTYPE html>
<!-- Add the xmlns:th attribute to enable Thymeleaf templating -->
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Main Page</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
        }
    </style>
</head>
<body class="bg-gradient-to-br from-blue-300 via-blue-400 to-cyan-400 min-h-screen flex items-center justify-center">

    <div class="text-center bg-white p-8 rounded-lg shadow-2xl max-w-md w-full mx-4">
        <!-- Header -->
        <div class="bg-blue-600 text-white py-4 px-6 rounded-t-lg -mx-8 -mt-8 mb-8">
            <h1 class="text-2xl font-bold">Hello World from Spring Boot MVC!</h1>
        </div>
        
        <!-- Welcome Banner -->
        <div class="bg-blue-500 text-white py-4 px-6 rounded-lg mb-8">
            <h2 class="text-xl font-semibold">
                Welcome to SiDating ❤️ 🚀
            </h2>
            <!-- Display the name from the model -->
            <p class="text-lg mt-2">
                Hello, <span th:text="${name}">SiDating User</span>!
            </p>
        </div>
        
        <!-- Navigation Buttons -->
        <div class="space-y-4">
            <div>
                <a href="/profile" class="inline-block bg-green-500 hover:bg-green-600 text-white font-semibold py-3 px-8 rounded-lg transition duration-200 w-full">
                    Go to Profiles
                </a>
            </div>
            <div>
                <a href="/posts" class="inline-block bg-orange-500 hover:bg-orange-600 text-white font-semibold py-3 px-8 rounded-lg transition duration-200 w-full">
                    Go to Posts
                </a>
            </div>
        </div>
    </div>

</body>
</html>
