<!DOCTYPE html>
<!-- Add the xmlns:th attribute to enable Thymeleaf templating -->
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Main Page</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
        }
    </style>
</head>
<body class="bg-gray-50 min-h-screen">

    <!-- Navigation -->
    <div th:insert="~{fragments/navbar :: navbar}"></div>

    <!-- Main Content -->
    <div class="flex items-center justify-center min-h-[calc(100vh-80px)] px-4">
        <div class="text-center max-w-md w-full">
            <!-- Welcome Section -->
            <div class="mb-12">
                <h1 class="text-3xl font-light text-gray-900 mb-4">
                    Hello World from Spring Boot MVC!
                </h1>
                <div class="mb-8">
                    <h2 class="text-xl font-medium text-gray-700 mb-2">
                        Welcome to SiDating
                    </h2>
                    <!-- Display the name from the model -->
                    <p class="text-gray-600">
                        Hello, <span th:text="${name}" class="font-medium">SiDating User</span>!
                    </p>
                </div>
            </div>
            
            <!-- Navigation Buttons -->
            <div class="space-y-3">
                <a href="/profile" class="block w-full py-3 px-6 bg-gray-900 text-white font-medium rounded-lg hover:bg-gray-800 transition-colors">
                    Go to Profiles
                </a>
                <a href="/posts" class="block w-full py-3 px-6 border border-gray-300 text-gray-700 font-medium rounded-lg hover:bg-gray-50 transition-colors">
                    Go to Posts
                </a>
            </div>
        </div>
    </div>

</body>
</html>
