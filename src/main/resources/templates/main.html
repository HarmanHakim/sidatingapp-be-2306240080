<!DOCTYPE html>
<!-- Add the xmlns:th attribute to enable Thymeleaf templating -->
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Main Page</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
        }
    </style>
</head>
<body class="bg-gray-100 flex items-center justify-center h-screen">

    <div class="text-center bg-white p-12 rounded-lg shadow-xl">
        <h1 class="text-4xl font-bold text-gray-800 mb-4">Welcome to Sidating App!</h1>
        <p class="text-lg text-gray-600">This page is served by a Java Spring Boot controller.</p>
        
        <!-- 
            Use th:text to display the 'name' attribute from the model.
            Thymeleaf will replace the content of this p tag with the value of the 'name' variable.
         -->
        <p class="text-2xl text-blue-600 mt-6 font-semibold">
            Hello, <span th:text="${name}"></span>!
        </p>
        
        <!-- Navigation Links -->
        <div class="mt-8 space-y-4">
            <div>
                <a href="/profile" class="inline-block bg-blue-500 hover:bg-blue-600 text-white font-medium py-3 px-6 rounded-lg transition duration-200">
                    Manage Profiles
                </a>
            </div>
            <div>
                <a href="/posts" class="inline-block bg-green-500 hover:bg-green-600 text-white font-medium py-3 px-6 rounded-lg transition duration-200">
                    View Posts
                </a>
            </div>
        </div>
    </div>

</body>
</html>
