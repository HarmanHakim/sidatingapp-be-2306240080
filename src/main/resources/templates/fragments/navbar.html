<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
</head>
<body>
    <!-- Minimalist Navigation Bar Fragment -->
    <nav th:fragment="navbar" class="bg-white border-b border-gray-200 px-6 py-4">
        <div class="flex items-center justify-between max-w-7xl mx-auto">
            <!-- Logo/Brand -->
            <div class="flex items-center space-x-8">
                <a href="/" class="text-xl font-semibold text-gray-900 hover:text-gray-700">
                    SiDating
                </a>
                
                <!-- Navigation Links -->
                <div class="hidden md:flex space-x-6">
                    <a href="/profile" class="text-gray-600 hover:text-gray-900 transition-colors">
                        Profiles
                    </a>
                    <a href="/posts" class="text-gray-600 hover:text-gray-900 transition-colors">
                        Posts
                    </a>
                </div>
            </div>
            
            <!-- Right side actions -->
            <div class="flex items-center space-x-4">
                <!-- Mobile menu button -->
                <button class="md:hidden p-2 rounded-md text-gray-600 hover:text-gray-900 hover:bg-gray-100">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"></path>
                    </svg>
                </button>
            </div>
        </div>
        
        <!-- Mobile menu -->
        <div class="md:hidden mt-4 pt-4 border-t border-gray-200">
            <div class="flex flex-col space-y-2">
                <a href="/profile" class="text-gray-600 hover:text-gray-900 px-3 py-2 rounded-md transition-colors">
                    Profiles
                </a>
                <a href="/posts" class="text-gray-600 hover:text-gray-900 px-3 py-2 rounded-md transition-colors">
                    Posts
                </a>
            </div>
        </div>
    </nav>
</body>
</html>
