<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="UTF-8" />
    <title th:text="${isEdit} ? 'Update Post' : 'Create Post'">Form Post</title>
    <style>
      body {
        font-family: Arial, sans-serif;
        background: #f9f9f9;
        margin: 20px;
      }
      .container {
        background: #fff;
        padding: 20px;
        border-radius: 8px;
        box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
        max-width: 500px;
        margin: auto;
      }
      h1 {
        text-align: center;
      }
      label {
        display: block;
        margin-top: 10px;
        font-weight: bold;
      }
      input,
      textarea,
      select {
        width: 100%;
        padding: 8px;
        margin-top: 5px;
        border: 1px solid #ccc;
        border-radius: 4px;
      }
      button {
        margin-top: 15px;
        padding: 8px 16px;
        border: none;
        border-radius: 4px;
        background: #28a745;
        color: #fff;
        cursor: pointer;
      }
      button:hover {
        background: #218838;
      }
      a {
        display: inline-block;
        margin-top: 10px;
        text-decoration: none;
        background: #007bff;
        color: #fff;
        padding: 6px 12px;
        border-radius: 4px;
      }
      a:hover {
        background: #0056b3;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <form th:action="${isEdit ? '/posts/update/'+ post.id : '/posts/create'}" th:method="${isEdit ? 'put' : 'post'}" th:object="${post}">
        <h1 th:text="${isEdit} ? 'Update Post' : 'Create Post'">Form Post</h1>
        <input type="hidden" name="_method" value="put" th:if="${isEdit}" />

        <select name="userProfileId" required>
          <option th:each="user : ${userProfiles}" th:value="${user.id}" th:text="${user.name}" th:selected="${post.userProfile != null and user.id == post.userProfile.id}"></option>
        </select>

        <label>Caption</label>
        <textarea th:field="*{caption}" rows="5" required></textarea>

        <label>Image URL</label>
        <input type="text" th:field="*{imageUrl}" />

        <button type="submit" class="btn-primary" th:text="${isEdit} ? 'Update' : 'Create'">Submit</button>
        <a href="/posts" class="btn-warning">Back to List</a>
      </form>
    </div>
  </body>
</html>
