<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${isEdit} ? 'Edit Post' : 'Create New Post'">Create/Edit Post</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
        }
    </style>
</head>
<body class="bg-gray-50">
    <!-- Navigation -->
    <div th:insert="~{fragments/navbar :: navbar}"></div>

    <div class="max-w-2xl mx-auto px-4 py-8">
        <div class="bg-white rounded-lg border border-gray-200 p-8">
            <h1 class="text-2xl font-light text-gray-900 text-center mb-8" th:text="${isEdit} ? 'Edit Post' : 'Create New Post'">Create New Post</h1>

            <form th:action="${isEdit} ? '/posts/update/' + ${postId} : '/posts/create'"
                  method="post" th:object="${post}" class="space-y-6">
                
                <!-- Hidden PUT method for update -->
                <input th:if="${isEdit}" type="hidden" name="_method" value="put">

                <!-- User -->
                <div>
                    <label for="userProfileId" class="block text-sm font-medium text-gray-700 mb-2">User</label>
                    <select id="userProfileId" name="userProfileId" th:field="*{userProfileId}" required
                            class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-gray-500 focus:border-transparent">
                        <option value="">Select User</option>
                        <option th:each="user : ${userProfiles}" 
                                th:value="${user.id}" 
                                th:text="${user.name}"
                                th:selected="${post.userProfileId == user.id}">
                        </option>
                    </select>
                </div>

                <!-- Caption -->
                <div>
                    <label for="caption" class="block text-sm font-medium text-gray-700 mb-2">Caption</label>
                    <textarea id="caption" name="caption" rows="4" th:field="*{caption}" required 
                              placeholder="Write something..."
                              class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-gray-500 focus:border-transparent resize-none"></textarea>
                </div>

                <!-- Image URL -->
                <div>
                    <label for="imageUrl" class="block text-sm font-medium text-gray-700 mb-2">Image URL</label>
                    <input type="url" id="imageUrl" name="imageUrl" th:field="*{imageUrl}" 
                           placeholder="http://example.com/image.jpg"
                           class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-gray-500 focus:border-transparent">
                </div>

                <!-- Image Preview -->
                <div id="imagePreview" class="hidden">
                    <label class="block text-sm font-medium text-gray-700 mb-2">Image Preview</label>
                    <div class="border border-gray-300 rounded-lg p-3">
                        <img id="previewImg" src="" alt="Image preview" class="max-h-48 w-auto mx-auto rounded">
                    </div>
                </div>

                <!-- isActive checkbox only for edit -->
                <div th:if="${isEdit}" class="flex items-center">
                    <input type="checkbox" id="isActive" name="isActive" th:field="*{isActive}"
                           class="w-4 h-4 text-gray-900 border-gray-300 rounded focus:ring-gray-500">
                    <label for="isActive" class="ml-2 text-sm text-gray-700">Active</label>
                </div>

                <div class="flex justify-center gap-3 pt-4">
                    <button type="submit" th:text="${isEdit} ? 'Update' : 'Create'"
                            class="px-6 py-2 bg-gray-900 text-white font-medium rounded-lg hover:bg-gray-800 transition-colors">
                        Create
                    </button>
                    <a href="/posts" class="px-6 py-2 border border-gray-300 text-gray-700 font-medium rounded-lg hover:bg-gray-50 transition-colors">
                        Cancel
                    </a>
                </div>
            </form>
        </div>
    </div>

    <script>
        // Image preview
        const imageInput = document.getElementById('imageUrl');
        const preview = document.getElementById('imagePreview');
        const previewImg = document.getElementById('previewImg');

        function showPreview(url) {
            if (url) {
                previewImg.src = url;
                preview.classList.remove('hidden');
                previewImg.onerror = () => preview.classList.add('hidden');
            } else {
                preview.classList.add('hidden');
            }
        }

        imageInput.addEventListener('input', e => showPreview(e.target.value));
        window.addEventListener('load', () => showPreview(imageInput.value));

        // Basic form validation
        document.querySelector('form').addEventListener('submit', function(e){
            if (!document.getElementById('userProfileId').value) {
                alert('Please select a user.');
                e.preventDefault();
            } else if (!document.getElementById('caption').value.trim()) {
                alert('Please enter a caption.');
                e.preventDefault();
            }
        });
    </script>
</body>
</html>
