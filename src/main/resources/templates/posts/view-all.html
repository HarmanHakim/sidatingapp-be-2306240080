<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>All Posts</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .navbar {
            background-color: #343a40 !important;
        }
        .post-card {
            border: 1px solid #dee2e6;
            border-radius: 8px;
            margin-bottom: 20px;
            background-color: white;
        }
        .post-header {
            padding: 15px;
            border-bottom: 1px solid #dee2e6;
        }
        .post-image {
            width: 100%;
            max-height: 400px;
            object-fit: cover;
        }
        .post-footer {
            padding: 15px;
        }
        .user-avatar {
            width: 40px;
            height: 40px;
            background-color: #007bff;
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
            font-weight: bold;
        }
        .filter-section {
            background-color: #f8f9fa;
            padding: 20px;
            margin-bottom: 20px;
            border-radius: 8px;
        }
        .btn-action {
            margin-right: 5px;
        }
    </style>
</head>
<body>
    <!-- Navigation Bar -->
    <nav class="navbar navbar-dark">
        <div class="container-fluid">
            <span class="navbar-brand mb-0 h1">localhost:8080/posts</span>
            <div class="d-flex">
                <span class="navbar-text me-3">🔍</span>
                <span class="navbar-text">⚙️</span>
            </div>
        </div>
    </nav>

    <div class="container mt-4">
        <!-- Success/Error Messages -->
        <div th:if="${successMessage}" class="alert alert-success alert-dismissible fade show" role="alert">
            <span th:text="${successMessage}"></span>
            <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
        </div>
        
        <div th:if="${errorMessage}" class="alert alert-danger alert-dismissible fade show" role="alert">
            <span th:text="${errorMessage}"></span>
            <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
        </div>

        <!-- Page Header -->
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h2>All Posts</h2>
            <a href="/posts/create" class="btn btn-primary">+ Create New Post</a>
        </div>

        <!-- Filter Section -->
        <div class="filter-section">
            <form method="get" action="/posts">
                <div class="row align-items-end">
                    <div class="col-md-4">
                        <label for="userId" class="form-label"><strong>Filter by User:</strong></label>
                        <select class="form-select" name="userId" id="userId">
                            <option value="all" th:selected="${selectedUserId == null or selectedUserId == 'all'}">-- All Users --</option>
                            <option th:each="user : ${userProfiles}" 
                                    th:value="${user.id}" 
                                    th:text="${user.name}"
                                    th:selected="${selectedUserId == user.id.toString()}"></option>
                        </select>
                    </div>
                    <div class="col-md-4">
                        <label for="order" class="form-label"><strong>Order:</strong></label>
                        <select class="form-select" name="order" id="order">
                            <option value="newest" th:selected="${selectedOrder == null or selectedOrder == 'newest'}">Newest First</option>
                            <option value="oldest" th:selected="${selectedOrder == 'oldest'}">Oldest First</option>
                        </select>
                    </div>
                    <div class="col-md-4">
                        <button type="submit" class="btn btn-success me-2">Apply</button>
                        <a href="/posts" class="btn btn-secondary">Reset</a>
                    </div>
                </div>
            </form>
        </div>

        <!-- Posts List -->
        <div th:if="${posts == null or posts.isEmpty()}" class="text-center py-5">
            <h5>No posts found</h5>
            <p class="text-muted">Be the first to create a post!</p>
        </div>

        <div th:each="post, iterStat : ${posts}" class="post-card" th:if="${posts != null}">
            <!-- Post Header -->
            <div class="post-header">
                <div class="d-flex align-items-center">
                    <div class="user-avatar me-3"
                        th:text="${post.userProfileName != null ? post.userProfileName.substring(0,1) : 'U'}">
                    </div>
                    <div>
                        <h6 class="mb-1" th:text="${post.userProfileName != null ? post.userProfileName : 'Unknown User'}">
                            User Name
                        </h6>
                        <small class="text-muted" 
                            th:text="${post.createdAt != null ? #temporals.format(post.createdAt, 'dd MMM yyyy HH:mm') : 'Unknown date'}">
                            Posted on date
                        </small>
                    </div>
                </div>
            </div>

            <!-- Post Image -->
            <div th:if="${post.imageUrl != null and not #strings.isEmpty(post.imageUrl)}">
                <img th:src="${post.imageUrl}" class="post-image" alt="Post Image">
            </div>

            <!-- Post Caption -->
            <div class="post-footer">
                <p th:text="${post.caption != null ? post.caption : ''}" class="mb-3">Post caption goes here...</p>

                <!-- Like Count -->
                <div class="mb-3">
                    <strong>Likes:</strong> <span th:text="${post.likeCount != null ? post.likeCount : 0}">0</span>
                </div>

                <!-- Posted At -->
                <div class="mb-3">
                    <strong>Posted:</strong> <span th:text="${post.timeAgo != null ? post.timeAgo : 'Just now'}">Just now</span>
                </div>

                <!-- Action Buttons -->
                <div class="d-flex">
                    <a th:href="@{/posts/{id}(id=${post.id})}" class="btn btn-info btn-sm btn-action">View</a>
                    <a th:href="@{/posts/update/{id}(id=${post.id})}" class="btn btn-warning btn-sm btn-action">Edit</a>
                    <form th:action="@{/posts/delete/{id}(id=${post.id})}" method="post" style="display: inline;">
                        <input type="hidden" name="_method" value="delete">
                        <button type="submit" class="btn btn-danger btn-sm" 
                                onclick="return confirm('Are you sure you want to delete this post?')">Delete</button>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
