<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>All Posts</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
        }
    </style>
</head>
<body class="bg-gray-50">
    <!-- Navigation Bar -->
    <div th:insert="~{fragments/navbar :: navbar}"></div>

    <div class="max-w-4xl mx-auto px-4 py-8">
        <!-- Success/Error Messages -->
        <div th:if="${successMessage}" class="mb-6 p-4 bg-green-50 border border-green-200 rounded-lg text-green-800">
            <span th:text="${successMessage}"></span>
        </div>
        
        <div th:if="${errorMessage}" class="mb-6 p-4 bg-red-50 border border-red-200 rounded-lg text-red-800">
            <span th:text="${errorMessage}"></span>
        </div>

        <!-- Page Header -->
        <div class="flex justify-between items-center mb-8">
            <h1 class="text-2xl font-light text-gray-900">All Posts</h1>
            <a href="/posts/create" class="px-4 py-2 bg-gray-900 text-white font-medium rounded-lg hover:bg-gray-800 transition-colors">
                Create New Post
            </a>
        </div>

        <!-- Filter Section -->
        <div class="bg-white p-6 rounded-lg border border-gray-200 mb-8">
            <form method="get" action="/posts" class="flex flex-col md:flex-row gap-4 items-end">
                <div class="flex-1">
                    <label for="userId" class="block text-sm font-medium text-gray-700 mb-2">Filter by User</label>
                    <select name="userId" id="userId" class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-gray-500 focus:border-transparent">
                        <option value="all" th:selected="${selectedUserId == null or selectedUserId == 'all'}">All Users</option>
                        <option th:each="user : ${userProfiles}" 
                                th:value="${user.id}" 
                                th:text="${user.name}"
                                th:selected="${selectedUserId == user.id.toString()}"></option>
                    </select>
                </div>
                <div class="flex-1">
                    <label for="order" class="block text-sm font-medium text-gray-700 mb-2">Order</label>
                    <select name="order" id="order" class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-gray-500 focus:border-transparent">
                        <option value="newest" th:selected="${selectedOrder == null or selectedOrder == 'newest'}">Newest First</option>
                        <option value="oldest" th:selected="${selectedOrder == 'oldest'}">Oldest First</option>
                    </select>
                </div>
                <div class="flex gap-2">
                    <button type="submit" class="px-4 py-2 bg-gray-900 text-white font-medium rounded-lg hover:bg-gray-800 transition-colors">
                        Apply
                    </button>
                    <a href="/posts" class="px-4 py-2 border border-gray-300 text-gray-700 font-medium rounded-lg hover:bg-gray-50 transition-colors">
                        Reset
                    </a>
                </div>
            </form>
        </div>

        <!-- Posts List -->
        <div th:if="${posts == null or posts.isEmpty()}" class="text-center py-12">
            <h3 class="text-lg font-medium text-gray-900 mb-2">No posts found</h3>
            <p class="text-gray-600">Be the first to create a post!</p>
        </div>

        <div class="space-y-6" th:if="${posts != null}">
            <div th:each="post, iterStat : ${posts}" class="bg-white rounded-lg border border-gray-200 overflow-hidden">
                <!-- Post Header -->
                <div class="p-6 border-b border-gray-100">
                    <div class="flex items-center">
                        <div class="w-10 h-10 bg-gray-900 text-white rounded-full flex items-center justify-center font-medium text-sm mr-3"
                            th:text="${post.userProfileName != null ? post.userProfileName.substring(0,1) : 'U'}">
                        </div>
                        <div>
                            <h3 class="font-medium text-gray-900" th:text="${post.userProfileName != null ? post.userProfileName : 'Unknown User'}">
                                User Name
                            </h3>
                            <p class="text-sm text-gray-500" 
                                th:text="${post.createdAt != null ? #temporals.format(post.createdAt, 'dd MMM yyyy HH:mm') : 'Unknown date'}">
                                Posted on date
                            </p>
                        </div>
                    </div>
                </div>

                <!-- Post Image -->
                <div th:if="${post.imageUrl != null and not #strings.isEmpty(post.imageUrl)}">
                    <img th:src="${post.imageUrl}" class="w-full max-h-96 object-cover" alt="Post Image">
                </div>

                <!-- Post Content -->
                <div class="p-6">
                    <p th:text="${post.caption != null ? post.caption : ''}" class="text-gray-900 mb-4">Post caption goes here...</p>

                    <!-- Post Stats -->
                    <div class="flex items-center gap-6 text-sm text-gray-500 mb-4">
                        <span>
                            <strong>Likes:</strong> <span th:text="${post.likeCount != null ? post.likeCount : 0}">0</span>
                        </span>
                        <span>
                            <strong>Posted:</strong> <span th:text="${post.timeAgo != null ? post.timeAgo : 'Just now'}">Just now</span>
                        </span>
                    </div>

                    <!-- Action Buttons -->
                    <div class="flex gap-2">
                        <a th:href="@{/posts/{id}(id=${post.id})}" class="px-3 py-1.5 text-sm border border-gray-300 text-gray-700 rounded-md hover:bg-gray-50 transition-colors">
                            View
                        </a>
                        <a th:href="@{/posts/update/{id}(id=${post.id})}" class="px-3 py-1.5 text-sm border border-gray-300 text-gray-700 rounded-md hover:bg-gray-50 transition-colors">
                            Edit
                        </a>
                        <form th:action="@{/posts/delete/{id}(id=${post.id})}" method="post" class="inline">
                            <input type="hidden" name="_method" value="delete">
                            <button type="submit" class="px-3 py-1.5 text-sm text-red-600 border border-red-300 rounded-md hover:bg-red-50 transition-colors" 
                                    onclick="return confirm('Are you sure you want to delete this post?')">
                                Delete
                            </button>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>

</body>
</html>
