spring.application.name=sidating-app-be
spring.mvc.hiddenmethod.filter.enabled=true

# Active Profile Configuration
spring.profiles.active=dev

# Default JPA Configuration
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true

# Allow circular references (for security)
spring.main.allow-circular-references=true

# JWT Configuration
sidating-app-be.app.jwtSecret=mysecretkeymysecretkeymysecretkeymysecretkeymysecretkey
sidating-app-be.app.jwtExpirationMs=86400000